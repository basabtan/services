<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progressive Disclosure Playground</title>
<style>
:root{--page:#e9e7e0;--bg:#fffdf8;--bg2:#f2efe7;--ink:#272c35;--muted:#6b7480;--line:#c6c2b6;--accent:#84652d;--navy:#192a42;--gold:#d5bd82}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1220px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:22px}.k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}h1{font:500 48px/1.02 Georgia,serif;margin:7px 0}.lead{max-width:650px;color:var(--muted);line-height:1.6}.reset{border:1px solid var(--line);background:var(--bg);padding:10px 14px;cursor:pointer}.journey{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;margin-top:24px}.panel{background:var(--bg);border:1px solid var(--line);min-height:520px}.head{padding:18px 20px;border-bottom:1px solid var(--line)}.head h2{font:500 25px Georgia,serif;margin:4px 0}.stack,.detail{padding:16px;display:grid;gap:10px}.card,.choice,.accordion>button{border:1px solid var(--line);background:var(--bg);padding:15px;text-align:left;width:100%;cursor:pointer}.card:hover,.choice:hover{transform:translateY(-1px)}.card.active{border-color:var(--accent)}.row{display:flex;justify-content:space-between;gap:16px}.card b{font:500 18px Georgia,serif}.card p,.choice span,.body{color:var(--muted);line-height:1.45;font-size:13px}.hero{background:var(--navy);color:#f4eee0;padding:24px;border:1px solid #70839e}.hero .k{color:var(--gold)}.hero h3{font:500 31px/1.1 Georgia,serif;margin:10px 0}.hero p{color:#b6c5d9}.choice.primary{background:linear-gradient(112deg,#d5bd82,#f4e9c6,#c6ab70);border-color:#aa8d50}.choice b,.choice span{display:block}.choice span{margin-top:4px}.path{display:flex;gap:7px;flex-wrap:wrap}.path span{padding:5px 7px;border:1px solid var(--line);font-size:10px;text-transform:uppercase;color:var(--muted)}.path span.on{color:var(--accent);border-color:var(--accent)}.accordion{border:1px solid var(--line)}.accordion>button{background:var(--bg2);border:0;font-weight:700}.body{display:none;padding:12px 14px}.accordion.open .body{display:block}@media(max-width:800px){.journey{grid-template-columns:1fr}.wrap{padding:16px}.top{align-items:start;flex-direction:column}h1{font-size:38px}}
</style></head><body><div class="wrap">
<header class="top"><div><div class="k">Services / interaction study</div><h1>Information, when you need it.</h1><div class="lead">A neutral playground for intent-aware progressive disclosure: signal → explanation → evidence → action → implementation → alternatives.</div></div><button class="reset" id="reset">Reset journey</button></header>
<main class="journey"><section class="panel"><div class="head"><div class="k">Layer 0</div><h2>What deserves attention?</h2></div><div class="stack" id="signals"></div></section><section class="panel"><div class="head"><div class="k">Focused disclosure</div><h2 id="stageTitle">Choose a signal</h2></div><div class="detail" id="detail"></div></section></main>
</div><script>
const items=[
{id:'delivery',title:'Delivery confidence',value:'62%',summary:'A high-priority workstream has lost confidence.',why:'Two dependencies are unresolved and the milestone has no confirmed owner.',evidence:['Dependency A has no completion date.','Dependency B is waiting on external input.','Milestone owner field is empty.'],action:'Assign an accountable owner and resolve the blocking dependency first.',implementation:'Name one owner, confirm the dependency due date, then re-score delivery confidence.',alternatives:['Inspect full dependency chain','Compare another workstream','Mark for later review']},
{id:'evidence',title:'Evidence coverage',value:'78%',summary:'Most decisions are supported, but one area is thin.',why:'The current conclusion relies on one evidence family rather than several independent signals.',evidence:['Primary record is present.','External validation is missing.','Latest review date is older than target.'],action:'Request the missing validation before escalating the decision.',implementation:'Add the missing source, record its date and confidence, then refresh the decision summary.',alternatives:['Accept current confidence','Open source dossier','Defer decision']},
{id:'momentum',title:'Project momentum',value:'84%',summary:'Healthy overall; one next action is becoming due.',why:'Progress remains strong, but the next milestone requires a decision within the current cycle.',evidence:['Recent tasks completed on time.','No active blockers.','Decision window opens next.'],action:'Prepare the next decision packet now.',implementation:'Summarize the decision, owner, options, evidence, and deadline in one compact packet.',alternatives:['Continue monitoring','Open timeline','Review recent activity']}
];
const signals=document.getElementById('signals'),detail=document.getElementById('detail'),stageTitle=document.getElementById('stageTitle');
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function renderSignals(active){signals.innerHTML='';items.forEach(x=>{const b=el('button','card'+(active===x.id?' active':''));const r=el('div','row');const left=el('div');left.append(el('div','k','signal'),el('b','',x.title));r.append(left,el('b','',x.value));b.append(r,el('p','',x.summary));b.onclick=()=>openLayer(x.id,'explanation');signals.append(b)})}
function path(layer){const p=el('div','path');['signal','explanation','evidence','action','implementation','alternatives'].forEach(l=>p.append(el('span',l===layer?'on':'',l)));return p}
function choice(label,note,primary,go,id){const b=el('button','choice'+(primary?' primary':''));b.append(el('b','',label),el('span','',note));b.onclick=()=>openLayer(id,go);return b}
function accordion(title,body){const a=el('div','accordion'),b=el('button','',title),d=el('div','body',body);b.onclick=()=>a.classList.toggle('open');a.append(b,d);return a}
function openLayer(id,layer){const x=items.find(v=>v.id===id);renderSignals(id);stageTitle.textContent=x.title;detail.innerHTML='';let text=x.summary,note='Start with the minimum useful signal.';if(layer==='explanation'){text=x.why;note='First click answers: why should I care?'}if(layer==='action'){text=x.action;note='One next action is promoted above alternatives.'}if(layer==='implementation'){text=x.implementation;note='Implementation appears only after the action is understood.'}const hero=el('div','hero');hero.append(el('div','k','Current focus · '+layer),el('h3','',text),el('p','',note));detail.append(hero,path(layer));
if(layer==='explanation'){detail.append(choice('What should I do?','Reveal the recommended next action.',true,'action',id),choice('Why does the system think this?','Inspect supporting evidence.',false,'evidence',id))}
if(layer==='evidence'){x.evidence.forEach((e,i)=>detail.append(accordion('Evidence detail '+(i+1),e)));detail.append(choice('Continue to recommended action','Move from evidence to action.',true,'action',id))}
if(layer==='action'){detail.append(choice('How would that work?','Reveal implementation detail.',true,'implementation',id),choice('Show other directions','Keep alternatives available but quieter.',false,'alternatives',id))}
if(layer==='implementation')detail.append(choice('Show alternatives','Inspect other valid paths.',false,'alternatives',id));
if(layer==='alternatives')x.alternatives.forEach(e=>detail.append(accordion(e,'Optional direction. The host application defines the content and consequence of this path.')))
}
renderSignals();document.getElementById('reset').onclick=()=>{renderSignals();detail.innerHTML='';stageTitle.textContent='Choose a signal'};
</script></body></html>
